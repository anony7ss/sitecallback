[build]
  command = "npm run build"
  publish = "dist"
  functions = "api"

[functions]
  node_bundler = "esbuild"

# 1. Endpoints de API Real (direto para api/*.js)
[[redirects]]
  from = "/api/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/api/oauth-callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/interactions"
  to = "/.netlify/functions/interactions"
  status = 200

[[redirects]]
  from = "/api/webhooks"
  to = "/.netlify/functions/webhooks"
  status = 200

[[redirects]]
  from = "/api/linked-roles"
  to = "/.netlify/functions/linked-roles"
  status = 200

# 2. Rotas do Frontend SPA (React Vite)
[[redirects]]
  from = "/oauth/callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
